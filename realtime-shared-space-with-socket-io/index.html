<!DOCTYPE HTMLa<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Website!!!</title>
		<style>
			/* this is a CSS comment */

			/* here, we change some of the default styles on our main document elements */
			html, body {
				margin: 0;
				background-color: lightskyblue;
			}

			body {
				padding: 20px;
			}

			#users {
				position: fixed;
				z-index: 999;
				pointer-events: none;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
			}

			.user {
				position: absolute;
				background-color: #ff6699;
				border-radius: 50%;
				display: block;
				width: 20px;
				height: 20px;
			}
		</style>
	</head>
	<body>

		<main>
			<h1>This is a Heading</h1>
			<h2>and a subheading</h2>
			<p>This is a paragraph.</p>
			<p>This is another paragraph.</p>
			<p>and yet another paragraph!</p>

			<!-- this is a comment! you can see it in the code but the browser won’t show it on the website. -->

			<div class="silly-text centre-text">
				<p>This is a paragraph inside a div with classes added, which lets us change its appearance in the style.css file.</p>
			</div>

			<!-- This is a relative link. It links to another page in the website using a path relative to its own position in the folder structure -->
			<a href="./page-1.html">Page 1</a>

			<!-- This is an absolute link. Following this path from anywhere on the internet will take you to the same place -->
			<!-- The target="_blank" attribute makes it open in a new tab -->
			<a href="https://forever-online-together-online.netlify.app/" target="_blank">Workshop link</a>
		</main>

		<div id="users"></div>

		<!-- this loads the socket library -->
		<script src="/socket.io/socket.io.js"></script>
		<script>
			const users = [];
			
			const socket = io();

			const form = document.getElementById('form');
			const input = document.getElementById('input');

			const handleMouseMove = (event) => {
				socket.emit('position', { x: event.clientX, y: event.clientY,});
			};

			socket.on('position', (data) => {
				let userIndex = -1
				for (let i = 0; i < users.length; i++) {
					if (users[i].id === data.id) {
						userIndex = i;
						break;
					}
				}

				if (userIndex > -1) {
					users[userIndex].position = data.position;
				} else {
					users.push(data);
				}


				const usersElement = document.querySelector('#users');
				if (usersElement) {
					usersElement.innerHTML = '';
					for (let i = 0; i < users.length; i++) {
						const user = users[i];
						const element = document.createElement('div');
						element.className = 'user';
						element.style.top = user.position.y + 'px';
						element.style.left = user.position.x + 'px';
						usersElement.appendChild(element);
					}
				}
			});


			
			window.addEventListener('mousemove', handleMouseMove);
		</script>
	</body>
</html>
