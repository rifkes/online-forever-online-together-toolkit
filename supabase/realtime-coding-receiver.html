<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Making data persist</title>
		<link rel="stylesheet" href="style.css"/>
  </head>
  <body>

		<textarea id="textarea"></textarea>

		<button id="copy">
			Copy!
		</button>

		<p class="copied">Code copied to clipboard!</p>

		<script type="module">
			import { supabase, } from './supabase-utils.js'

			// select the textarea
			const textarea = document.querySelector('#textarea');
			const room = supabase.channel('code');

			// set up our page to receive the code when it gets updated
			room
			.on('broadcast', { event: 'code' }, ({ payload }) => {
				textarea.value = payload.code;
			})
			.subscribe((status) => {
				if (status === 'SUBSCRIBED') {
				}
			});

			let timeout;

			// this function copies the text
			const handleCopy = () => {
				textarea.select();
				document.execCommand('copy');

				// add a class to the body element which shows the message saying copy has worked
				document.body.classList.add('copy-success');

				// after a time of 1000 milliseconds, we hide this message again
				timeout = setTimeout(() => {
					document.body.classList.remove('copy-success');
				}, 1000);
			}

			// make a variable for the copy button
			const copy = document.querySelector('#copy');

			// add an event listener for when we click our copy button
			copy.addEventListener('click', handleCopy);

		</script>

  </body>
</html>
