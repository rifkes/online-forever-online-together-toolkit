<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Making data persist</title>
		<link rel="stylesheet" href="style.css"/>
  </head>
  <body>

		<textarea id="textarea"></textarea>

		<button id="copy">
			Copy!
		</button>

		<p class="copied">Code copied to clipboard!</p>

		<script type="module">
			import { supabase, } from './supabase-utils.js'

			const textarea = document.querySelector('#textarea');
			const room = supabase.channel('code');

			const handleChange = (e) => {

				room.send({
					type: 'broadcast',
					event: 'paint',
					payload: { 
						x: xPercent, 
						y: yPercent,
						color: color,
					},
				});
			}

			room
			.on('broadcast', { event: 'paint' }, ({ payload }) => {
				textarea.value = payload.code;
			})
			.subscribe((status) => {
				if (status === 'SUBSCRIBED') {
				}
			});

			let timeout;

			const handleCopy = () => {
				textarea.select();
				document.execCommand('copy');
				document.body.classList.add('copy-success');
				timeout = setTimeout(() => {
					document.body.classList.remove('copy-success');
				}, 1000);
			}

			const copy = document.querySelector('#copy');

			copy.addEventListener('click', handleCopy);

		</script>

  </body>
</html>
