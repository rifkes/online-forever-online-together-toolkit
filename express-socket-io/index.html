<!DOCTYPE HTMLa<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Website!!!</title>
		<style>
			/* this is a CSS comment */

			/* here, we change some of the default styles on our main document elements */
			html, body {
				margin: 0;
				background-color: lightskyblue;
			}

			body {
				padding: 20px;
			}

			#users {
				position: fixed;
				z-index: 999;
				pointer-events: none;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
			}

			.user {
				position: absolute;
				background-color: #ff6699;
				border-radius: 50%;
				display: block;
				width: 20px;
				height: 20px;
			}
		</style>
	</head>
	<body>

		<main>
			<p>This website uses a server to display every visitor’s mouse movements at the same time</p>
		</main>

		<div id="users"></div>

		<!-- this loads the socket library -->
		<script src="/socket.io/socket.io.js"></script>
		<script>
			const users = [];
			
			const socket = io();

			const form = document.getElementById('form');
			const input = document.getElementById('input');

			const handleMouseMove = (event) => {
				socket.emit('position', { x: event.clientX, y: event.clientY,});
			};

			socket.on('position', (data) => {
				let userIndex = -1
				for (let i = 0; i < users.length; i++) {
					if (users[i].id === data.id) {
						userIndex = i;
						break;
					}
				}

				if (userIndex > -1) {
					users[userIndex].position = data.position;
				} else {
					users.push(data);
				}


				const usersElement = document.querySelector('#users');
				if (usersElement) {
					usersElement.innerHTML = '';
					for (let i = 0; i < users.length; i++) {
						const user = users[i];
						const element = document.createElement('div');
						element.className = 'user';
						element.style.top = user.position.y + 'px';
						element.style.left = user.position.x + 'px';
						usersElement.appendChild(element);
					}
				}
			});


			
			window.addEventListener('mousemove', handleMouseMove);
		</script>
	</body>
</html>
